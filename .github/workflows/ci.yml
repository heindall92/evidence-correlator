name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas (solo librería estándar)
        run: python -W error::SyntaxWarning -m unittest discover -s tests -t . -v
      - name: Redacción (marcadores de texto generado)
        run: python scripts/redaccion.py --avisos
      - name: CLI de extremo a extremo
        run: |
          python -m trama run -o output/bundle.json --dashboard-js /tmp/bundle.js
          python -m trama verify output/bundle.json
          python -m trama rules
      - name: Instalación como paquete
        run: |
          python -m pip install --quiet .
          cd /tmp && trama --version
          trama import "$GITHUB_WORKSPACE/tests/fixtures/nativo/nmap.xml" "$GITHUB_WORKSPACE/tests/fixtures/nativo/audit.log"
          trama run "$GITHUB_WORKSPACE"/tests/fixtures/nativo/* -o /tmp/real.json && trama verify /tmp/real.json

  browser:
    name: Dashboard · axe-core y Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          python -m pip install --quiet "playwright==1.64.0"
          python -m playwright install --with-deps chromium
      - name: El paquete de ejemplo del dashboard está al día
        run: python -m unittest tests.test_static -v
      - name: Accesibilidad e interacción
        run: python -m unittest tests.browser.test_dashboard_browser -v
