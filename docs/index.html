<!doctype html>
<html lang="es" data-theme="dark" data-accent="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="description" content="TRAMA: sigue el hilo del hallazgo del pentest a la alerta del SOC y a la no conformidad (ENS, ISO/IEC 27001, NIS2), con cadena de custodia SHA-256 y Merkle. Local, sin servidor.">
<title>TRAMA</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme-boot.js"></script>
</head>
<body>
<a class="skip" href="#main" id="skip">Saltar al contenido</a>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-in">
      <div class="brand">
        <span class="logo" data-icon="waypoints" aria-hidden="true"></span>
        <span class="brand-t"><b class="brand-name">TRAMA</b><small id="brand-sub">Sigue el hilo</small></span>
      </div>
      <button class="pkg press" type="button" id="pkg-btn"></button>
      <nav class="nav" id="nav"><span class="nav-pill" id="nav-pill" aria-hidden="true"></span></nav>
      <div class="side-foot">
        <div>
          <div class="acc-k" id="acc-k"><span data-icon="palette" aria-hidden="true"></span><span id="acc-label">Acento</span></div>
          <div class="swatches" id="swatches"></div>
        </div>
        <button class="account press" type="button" id="account-btn"></button>
      </div>
    </div>
  </aside>

  <div class="col">
    <header class="top" id="top">
      <button class="icon-btn press desk-only" type="button" id="collapse-btn" aria-controls="side"><span data-icon="panel-left" aria-hidden="true"></span></button>
      <span class="brand-mini mobile-only" aria-hidden="true"><span class="logo" data-icon="waypoints"></span>TRAMA</span>
      <span class="chip-local" id="chip-local"><span data-icon="wifi-off" aria-hidden="true"></span><span class="lbl" id="chip-local-t">Local</span></span>
      <span class="spacer"></span>
      <button class="searchbtn press" type="button" id="search-btn" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K /"><span data-icon="search" aria-hidden="true"></span><span id="search-btn-t">Buscar</span><kbd id="search-kbd">Ctrl K</kbd></button>
      <div class="seg" role="group" id="lang-seg">
        <button type="button" data-lang="es" lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="switch press" type="button" role="switch" id="theme-btn" aria-checked="true"><span class="knob" aria-hidden="true"></span><span class="t-sun" data-icon="sun" aria-hidden="true"></span><span class="t-moon" data-icon="moon" aria-hidden="true"></span></button>
      <button class="icon-btn press desk-only" type="button" id="settings-btn" aria-haspopup="dialog"><span data-icon="sliders-horizontal" aria-hidden="true"></span></button>
      <button class="icon-btn press" type="button" id="help-btn" aria-haspopup="dialog" aria-keyshortcuts="Shift+?"><span data-icon="circle-question-mark" aria-hidden="true"></span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>

<nav class="bnav" id="bnav"></nav>

<dialog id="dlg-search" class="search-dlg"></dialog>
<dialog id="dlg-help"></dialog>
<dialog id="dlg-settings" class="sheet"></dialog>
<dialog id="dlg-profile" class="sheet"></dialog>
<dialog id="dlg-more" class="sheet"></dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="drop" id="drop" hidden></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script src="assets/vendor/lucide-icons.js"></script>
<script src="data/bundle.js"></script>
<script src="assets/sha256.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
